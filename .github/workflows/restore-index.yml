name: Restore index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy Pro Barber file to index.html
        run: cp pro-barber-website.html index.html
      - name: Commit index.html
        run: |
          git config user.name "ben18855"
          git config user.email "ben18855@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore index.html from pro-barber-website.html"
          git push
